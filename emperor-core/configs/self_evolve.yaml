# huanxin-ai 自进化闭环运行配置（落地部署用）
#
# 用法：
#   python scripts/run_self_evolve.py --config configs/self_evolve.yaml
#   huanxin self-evolve --config configs/self_evolve.yaml
#
# 安全姿态（生产推荐）：
#   - 评测闸严格（min_pass_rate 高 + 禁止回归），基准不过绝不写回
#   - 人类审批门开启（use_approval_engine: true，auto_approve: false）
#     → 每次写回只"创建审批请求"进 approval.db，等人类 approve 后才由另一条流程发 PR
#   - 写回默认离线记录（writeback: record），确需自动 PR 时再切 live
#
# 离线演示想直接看到"真实基因 diff 的 PR 意图"，可把 write_gate.min_pass_rate 调低、
# 并把 use_approval_engine 设为 false（仅为展示机制，非生产姿态）。

cycles: 6
tasks_per_minister: 2
seed: 7
repo: kiwoen/huanxin-ai
genome_state_path: huanxin/court/genome_state.json
resume: false

# 人类审批门：生产必须为 false（需人工复核）。离线演示可用 --auto-approve 临时开启。
auto_approve: false
use_approval_engine: true
use_audit: true

# 写回模式：record(离线记录) | none(禁用) | live(真实 PR，需 gh 凭据)
writeback: record

write_gate:
  min_pass_rate: 0.9            # 生产应 ≥ 0.9，黄金基准可设 1.0
  forbid_regression: true

circuit_breaker:
  drop_fraction: 0.25          # 平均功勋相对峰值跌幅 ≥ 25% 即熔断
  consecutive_negative: 4      # 连续 4 轮下降即熔断
  min_cycles_before_trip: 2

promotion_gate:
  required_consecutive_gains: 3
  min_merit: 50.0

enable_auto_elimination: false  # 安全默认：淘汰仍冻结（dry-run）

# ── Phase 9/10：生产级安全护栏（fail-closed，写回前最后一道闸门）──
use_safety_gate: true            # 金标准安全闸：schema/唯一性/质量地板/核心大臣在位/受保护路径/无回归
quality_floor: 0.05              # 任一基因质量不得低于此地板
core_ministers: ["math_alpha", "reason_gamma"]  # 核心大臣一个都不能少
max_regression: 0.10             # 金标准大臣平均质量允许的最大回退
# 行为级金标准地板（DGM「金标准安全数据集」落地）：最优大臣在基准上的真实答对率
# 不得低于此值，否则 fail-closed 拒绝写回——防 reward-hacking（质量刷高但真实表现崩）。
# 与上面的结构检查互补：结构全过 ≠ 行为没崩。生产可调高（如 0.7）。
golden_pass_rate_min: 0.6

# 资源预算护栏：单轮越限即熔断，防止自进化跑飞（墙钟 / 操作数）
resource_seconds: 120.0
resource_max_ops: null

# 安全快照：每轮写回前落盘，事后可一键回滚到 safe 已知点
enable_snapshots: true
snapshot_dir: huanxin/court/snapshots


# ── Phase 12：持久化经验记忆（自我学习跨重启累积）──
# 每次任务真实成败记入 CourtMemory 并落盘，使进化学到的经验跨重启/跨进程累积，
# 而非仅活在当次进程内存。落盘路径默认 huanxin/court/memory.json（已 .gitignore，属运行时产物）。
use_memory: true
memory_path: huanxin/court/memory.json
# CLI 可临时覆盖：huanxin self-evolve --no-memory  关闭记忆；--memory-path <path> 换落盘位置

# ── Phase 12 续：记忆驱动基因 warm-start（opt-in，默认关）──
# 开启后，run() 启动时用已落盘经验把冷启动基因朝「该域历史最优方向」轻推，
# 让新实例/新部署直接站在历史经验肩上（不覆盖已恢复的基因检查点）。
# 通常配合 resume=False 使用（用经验播种基因、但仍从初始基因重新进化）。
warm_start_from_memory: false

# ── Phase 12 续⁵：记忆衰减 / 留存窗口（opt-in，默认关 → 零回归）──
# memory_max_per_group: 每(大臣,领域)留存上限，超限丢弃最旧样本（边界化"只增不减"）；null=不封顶
memory_max_per_group: null
# memory_recency_decay: 路由/暖启动的历史成功率时间衰减；1.0=等权(零回归)，<1.0=新鲜样本权重更高
memory_recency_decay: 1.0
# CLI 覆盖：--memory-max-per-group <N>  /  --memory-recency-decay <0~1>
