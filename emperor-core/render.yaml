# Render Blueprint — huanxin-ai v2.0.0
# https://render.com/docs/blueprint-spec
#
# ⚠️ 说明（与自管云服务器方案的差异）：
#   1. Render 免费套餐**没有持久磁盘**，容器重启即清空 /app/data。
#      也就是说 audit.db / approval.db（不可篡改审计与人类审批记录）
#      以及 huanxin.db 都会丢——这类数据必须外置到托管数据库，
#      或者直接用自管 VM + docker compose 命名卷（推荐，见
#      docs/DEPLOY_CLOUD_VM.md）。
#   2. 免费实例 15 分钟无流量会休眠，冷启动数十秒，自进化调度器会被打断。
#   3. 端口/主机与 Dockerfile、docker-compose.yml 保持同一事实来源：
#      0.0.0.0:8000，健康检查路径 /health（由 court_api.create_app() 提供）。

services:
  - type: web
    name: huanxin-ai
    env: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: HUANXIN_MODE
        value: server
      # huanxin/cli.py:cmd_serve 会读取下面两个变量（命令行 > 环境变量 > 默认）
      - key: HUANXIN_PORT
        value: "8000"
      - key: HUANXIN_HOST
        value: 0.0.0.0
      # 持久化根目录；免费套餐下它只是容器内临时目录，重启即丢（见顶部说明）
      - key: HUANXIN_DATA_DIR
        value: /app/data
      - key: HUANXIN_COURT_PATH
        value: /app/data
      - key: HUANXIN_ENABLE_FEEDBACK
        value: "true"
      # 不填任何 Key 时保持 mock，服务可离线完整启动
      - key: HUANXIN_LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

databases:
  - name: emperor-db
    plan: free
    ipAllowList: []
