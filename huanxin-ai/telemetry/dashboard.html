<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>huanxin-ai · 自进化系统可观测性看板</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2740; --border: #2a3654;
    --text: #e6ecf7; --muted: #8fa0c0; --accent: #4f8cff;
    --ok: #2fbf71; --warn: #f0a13a; --bad: #e5533d; --halt: #c23b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .4px; }
  .b-healthy { background: rgba(47,191,113,.15); color: var(--ok); border: 1px solid var(--ok); }
  .b-degraded { background: rgba(240,161,58,.15); color: var(--warn); border: 1px solid var(--warn); }
  .b-halted { background: rgba(194,59,59,.18); color: #ff8a7a; border: 1px solid var(--halt); }
  .b-unknown { background: rgba(143,160,192,.15); color: var(--muted); border: 1px solid var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 650; }
  .big { font-size: 34px; font-weight: 750; line-height: 1; }
  .metric-label { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .state { font-size: 22px; font-weight: 750; }
  .bar { height: 8px; border-radius: 999px; background: var(--panel2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 650; font-size: 12px; }
  .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .p-active { background: rgba(47,191,113,.15); color: var(--ok); }
  .p-shadow { background: rgba(79,140,255,.15); color: var(--accent); }
  .p-eliminated { background: rgba(229,83,61,.15); color: var(--bad); }
  .merit-cell { display: flex; align-items: center; gap: 8px; min-width: 140px; }
  .merit-cell .bar { flex: 1; margin-top: 0; }
  .events { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .events li { padding: 7px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
  .ev-act { font-weight: 700; }
  .ev-promote { color: var(--ok); } .ev-eliminate { color: var(--bad); }
  .domain-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .domain-row .name { width: 90px; color: var(--muted); }
  .domain-row .bar { flex: 1; margin-top: 0; }
  .domain-row .val { width: 48px; text-align: right; }
  .empty { color: var(--muted); font-size: 13px; font-style: italic; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
  <header>
    <h1>huanxin-ai · 自进化系统可观测性看板</h1>
    <span id="health" class="badge b-unknown">unknown</span>
    <span class="sub" id="generated"></span>
  </header>

  <div class="grid">
    <div class="card">
      <h2>基准评测通过率</h2>
      <div class="big" id="eval-rate">—</div>
      <div class="metric-label" id="eval-frac">—</div>
    </div>
    <div class="card">
      <h2>进化熔断器</h2>
      <div class="state" id="circuit-state">—</div>
      <div class="metric-label" id="circuit-peak">—</div>
    </div>
    <div class="card">
      <h2>进化事件</h2>
      <div class="big" id="ev-count">—</div>
      <div class="metric-label" id="ev-breakdown">—</div>
    </div>
    <div class="card">
      <h2>成本</h2>
      <div class="big" id="cost-total">—</div>
      <div class="metric-label" id="cost-budget">—</div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns: 1fr 1fr;">
    <div class="card">
      <h2>各域通过率</h2>
      <div id="domains"></div>
    </div>
    <div class="card">
      <h2>最近进化事件</h2>
      <ul class="events" id="events"></ul>
    </div>
  </div>

  <div class="card">
    <h2>大臣功勋榜</h2>
    <table id="ministers">
      <thead><tr><th>大臣</th><th>域</th><th>功勋</th><th>状态</th><th>连胜/连败</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>telemetry schema v<span id="schema">—</span> · 数据来自同目录 telemetry.js（window.TELEMETRY）</footer>

<script src="telemetry.js"></script>
<script>
(function () {
  const T = window.TELEMETRY || {};
  const $ = (id) => document.getElementById(id);
  const pct = (x) => (x == null ? "—" : (x * 100).toFixed(1) + "%");

  // header
  const health = T.health || "unknown";
  const h = $("health");
  h.textContent = health;
  h.className = "badge b-" + (["healthy","degraded","halted"].includes(health) ? health : "unknown");
  $("generated").textContent = "生成于 " + (T.generated_at || "—");
  $("schema").textContent = T.schema_version || "—";

  // eval
  const ev = T.evaluation || {};
  $("eval-rate").textContent = ev.cases ? pct(ev.pass_rate) : "—";
  $("eval-frac").textContent = ev.cases ? `${ev.passed}/${ev.cases} 通过` : "无评测数据";

  // circuit
  const c = T.circuit || {};
  const st = c.state || "—";
  $("circuit-state").textContent = st;
  $("circuit-state").style.color = c.is_open ? "var(--bad)" : "var(--ok)";
  $("circuit-peak").textContent = "峰值功勋 " + (c.peak_merit != null ? c.peak_merit.toFixed(1) : "—");

  // events
  const eo = T.evolution || {};
  $("ev-count").textContent = eo.event_count != null ? eo.event_count : "—";
  $("ev-breakdown").textContent = `晋升 ${eo.promotions || 0} · 淘汰 ${eo.eliminations || 0}`;
  const ul = $("events");
  const recent = eo.recent || [];
  ul.innerHTML = recent.length ? recent.map(e =>
    `<li><span class="ev-act ev-${e.action}">${e.action}</span>
     <span>${e.minister || ""}</span>
     <span class="sub">${(e.merit_before ?? "").toString().slice(0,6)} → ${(e.merit_after ?? "").toString().slice(0,6)}</span></li>`
  ).join("") : `<li class="empty">无进化事件</li>`;

  // domains
  const doms = ev.per_domain || {};
  const dkeys = Object.keys(doms);
  $("domains").innerHTML = dkeys.length ? dkeys.sort().map(k =>
    `<div class="domain-row"><span class="name">${k}</span>
     <div class="bar"><span style="width:${(doms[k]*100).toFixed(1)}%"></span></div>
     <span class="val">${pct(doms[k])}</span></div>`
  ).join("") : `<div class="empty">无逐域数据</div>`;

  // cost
  const cost = T.cost || {};
  $("cost-total").textContent = (cost.total != null ? cost.total.toFixed(2) : "—");
  $("cost-budget").textContent = cost.budget ? `预算 ${cost.budget.toFixed(2)}` : "无预算上限";

  // ministers
  const tb = document.querySelector("#ministers tbody");
  const ms = (T.ministers || []).slice().sort((a,b) => b.merit - a.merit);
  tb.innerHTML = ms.length ? ms.map(m =>
    `<tr><td>${m.name}</td><td>${m.domain}</td>
     <td><div class="merit-cell"><div class="bar"><span style="width:${Math.min(m.merit,100)}%"></span></div><span>${m.merit.toFixed(1)}</span></div></td>
     <td><span class="pill p-${m.status}">${m.status}</span></td>
     <td>${m.success_streak || 0} / ${m.failure_streak || 0}</td></tr>`
  ).join("") : `<tr><td colspan="5" class="empty">无大臣数据（用 --demo 生成示例）</td></tr>`;
})();
</script>
</body>
</html>
