name: CI

defaults:
  run:
    working-directory: huanxin-ai

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-lint-${{ runner.os }}-
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    name: Test py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\pip\Cache' || '~/.cache/pip' }}
          key: pip-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python }}-
            pip-${{ runner.os }}-
      - run: pip install ".[dev]"
      - run: python -m pytest tests/ -q --tb=short -m "not network" --timeout 120 --ignore=tests/test_core.py --ignore=tests/test_e2e_integration.py
      - run: python -m pytest tests/ -q --tb=short --cov=huanxin --cov-report=xml --cov-report=term -m "not network" --timeout 120 --ignore=tests/test_core.py --ignore=tests/test_e2e_integration.py
        if: matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./huanxin-ai/coverage.xml
          flags: py${{ matrix.python }}

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-mypy-${{ runner.os }}-
      - run: pip install ".[dev]"
      - run: mypy huanxin/ --ignore-missing-imports
